# RRLANG document-pack target manifest v0.1
# Purpose: fetch a clean cross-linguistic UDHR baseline plus optional parallel corpora.
# Mesu is already included from the user-provided seed dataset.

[pack]
name = "rrlang_document_pack_v0_1"
created_utc = "2026-07-05T10:53:45.621142+00:00"
status = "download_manifest_plus_mesu_seed"

# language_code = internal short name used by rrlang pack
# rrlang_language = display language name
# preferred_sources order: ohchr_html, efele_txt, efele_bulk
# efele_candidates are tried against https://efele.net/udhr/d/udhr_<candidate>.txt
# ohchr_path is appended to https://www.ohchr.org/en/human-rights/universal-declaration/translations/

[[udhr_languages]]
language_code = "en"
rrlang_language = "English"
ohchr_path = "english"
efele_candidates = ["eng"]

[[udhr_languages]]
language_code = "cy"
rrlang_language = "Welsh"
ohchr_path = "welsh-cymraeg"
