# Example Mesu config using hyphen-as-morpheme-boundary mode.
name = "mesu_boundary_probe_v0_2"
input_path = "../rrlang_dataset_seed_v0_1/datasets/parallel/udhr/mesu/udhr_mesu_text_only.txt"
language = "Mesu"
output_json = "outputs/mesu_udhr_v0_2_report.json"
output_text = "outputs/mesu_udhr_v0_2_report.txt"
encodings = ["utf8_bits", "grapheme", "grapheme_class", "word_boundary", "frequency_class"]
null_samples = 100
seed = 18427
case_policy = "lowercase"
punctuation_policy = "preserve"
hyphen_policy = "morpheme_boundary"
whitespace_policy = "normalise"
