# rrlang MVP config. This parser intentionally supports a simple TOML-like subset.
name = "mvp_english_basic_v0_2"
input_path = "testdata/tiny/english.txt"
language = "English"
output_json = "outputs/english_report.json"
output_text = "outputs/english_report.txt"
encodings = ["utf8_bits", "grapheme", "grapheme_class", "word_boundary", "frequency_class"]
null_samples = 100
seed = 18427
case_policy = "lowercase"
punctuation_policy = "preserve"
whitespace_policy = "normalise"
hyphen_policy = "punctuation"
