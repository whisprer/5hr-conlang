# Example control config for a text file containing literal 0/1 characters.
name = "random_bits_bit_text_v0_2"
input_path = "../rrlang_dataset_seed_v0_1/datasets/controls/random_bits_10k.txt"
language = "ControlRandomBits"
output_json = "outputs/random_bits_bit_text_report.json"
output_text = "outputs/random_bits_bit_text_report.txt"
encodings = ["bit_text"]
null_samples = 100
seed = 18427
case_policy = "preserve"
punctuation_policy = "preserve"
hyphen_policy = "punctuation"
whitespace_policy = "normalise"
